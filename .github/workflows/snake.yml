name: snake

on:
  schedule:
    # Runs daily at 11:30 PM IST (18:00 UTC)
    - cron: '0 18 * * *'
  workflow_dispatch: # Lets you trigger it manually anytime

jobs:
  auto-commit:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Git config
      run: |
        git config --local user.email "harshithguptaa2@gmail.com"
        git config --local user.name "progharshith"

    - name: Create Empty Commit
      run: |
        git commit --allow-empty -m "Daily streak buffer"

    - name: Push changes
      uses: ad-m/github-push-action@master
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        branch: master
