name: snake

on:
  schedule:
    # Runs daily at 11:30 PM IST (18:00 UTC)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - master

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. This was missing! It loads the repo environment so the snake can actually build.
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Generates the animation files from your graph data
        name: Generate Snake Files
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: progharshith
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      # 3. Pushes the files to 'master' so it lights up your contribution graph
      - name: Push to master branch (Locks in contribution)
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: master
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
