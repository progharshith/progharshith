name: Profile Automation

on:
  schedule:
    - cron: "0 18 * * *" # 11:30 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: progharshith
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Refresh profile metadata
        run: |
          mkdir -p .github/data

          cat > .github/data/profile-metadata.json << EOF
          {
            "last_updated": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "profile": "progharshith"
          }
          EOF

      - name: Commit updates
        uses: EndBug/add-and-commit@v9
        with:
          add: |
            dist
            .github/data/profile-metadata.json
          message: "chore: refresh profile assets"
